services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: veloit-rag-backend:latest
    container_name: veloit-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CHUNKS_FILE: /app/output/chunks.jsonl
      QDRANT_PATH: /app/qdrant_data
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./qdrant_data:/app/qdrant_data
      - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: veloit-rag-frontend:latest
    container_name: veloit-rag-frontend
    ports:
      - "3000:3000"
    environment:
      FASTAPI_BASE_URL: http://backend:8000
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

