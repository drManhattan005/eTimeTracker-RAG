services:
  ollama:
    image: ollama/ollama:latest
    container_name: veloit-rag-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: veloit-rag-backend:latest
    container_name: veloit-rag-backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:1.5b
      CHUNKS_FILE: /app/output/chunks.jsonl
      QDRANT_PATH: /app/qdrant_data
      OLLAMA_NUM_CTX: "4096"
      OLLAMA_NUM_PREDICT: "512"
      OLLAMA_TEMPERATURE: "0.1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./qdrant_data:/app/qdrant_data
      - ./output:/app/output
    restart: unless-stopped
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: veloit-rag-frontend:latest
    container_name: veloit-rag-frontend
    ports:
      - "3000:3000"
    environment:
      FASTAPI_BASE_URL: http://backend:8000
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ollama_data:
